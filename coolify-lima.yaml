minimumLimaVersion: 2.0.0
cpus: 4
memory: 8GiB
disk: 80GiB
base:
  - template:docker-rootful
portForwards:
  - guestPort: 80
    hostPort: 80
    hostIP: 192.168.1.3
  - guestPort: 443
    hostPort: 443
    hostIP: 192.168.1.3
  - guestPort: 8000
    hostPort: 8000
    hostIP: 192.168.1.3
  - guestPort: 6001
    hostPort: 6001
    hostIP: 192.168.1.3
  - guestPort: 6002
    hostPort: 6002
    hostIP: 192.168.1.3
